<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vragenlijst · Deckshare</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5F2EA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231E3A2F'/%3E%3Cpath d='M9 7.5H18C21.5 7.5 24 10 24 13.5V18.5C24 22 21.5 24.5 18 24.5H9Z' fill='none' stroke='%23F5F2EA' stroke-width='2.4' stroke-linejoin='miter'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Saira:wdth,wght@100..125,300..600&display=swap">
<link rel="stylesheet" href="/huisstijl.css">
<style>
/* Vragenlijst: een vraag tegelijk, zonder kader */
[hidden] { display: none !important; }
body { min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; }
.vragen { max-width: 640px; }
.vraag { display: flex; flex-direction: column; gap: 28px; }
.vraag .kicker { margin: 0; }
.vraag h1:focus { outline: none; }

.antwoorden { display: grid; gap: 12px; margin: 8px 0 0; padding: 0; list-style: none; }
.antwoorden .knop { width: 100%; }

.uitkomst { margin-top: 12px; }
.uitkomst .kicker { margin-bottom: 16px; }
.pad { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 16px; color: var(--mos); }
.pad b { color: var(--groen); }

.verder { display: flex; flex-wrap: wrap; gap: 4px 28px; }
button.link { padding: 0; border: 0; background: none; color: var(--groen); font: inherit; cursor: pointer; }

.alle { margin-top: clamp(56px, 7vw, 88px); }

@media (prefers-reduced-motion: no-preference) { .vraag { animation: in .3s ease; } }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header class="kop kop-licht"><div class="wrap"><span class="mark">Deckshare.</span></div></header>

<main class="opening">
  <div class="wrap smal">
    <div class="vragen">
      <div class="vraag" id="card" aria-live="polite">
        <p class="kicker" id="step"></p>
        <h1 class="groot-zin" id="title" tabindex="-1"></h1>
        <ul class="antwoorden" id="answers"></ul>
        <div class="uitkomst" id="result" hidden>
          <p class="kicker">Jouw antwoorden</p>
          <ol class="pad" id="path"></ol>
        </div>
        <div class="verder">
          <button class="link" id="back" type="button" hidden>Vorige vraag</button>
          <button class="link" id="restart" type="button" hidden>Opnieuw beginnen</button>
        </div>
      </div>
      <a class="knop alle" href="concepten/">Uitleg van de concepten</a>
    </div>
  </div>
</main>

<div class="donker op-donker"><footer class="voet"><div class="wrap"><p class="groot">DECKSHARE.</p></div></footer></div>

<script>
// Vragenboom, overgenomen uit "Vragenboom concepten.png" in de vault.
// Een vraag heeft antwoorden; elk antwoord wijst naar een volgende vraag (q) of een uitkomst (r).
var Q = {
  boot:      { t: 'Heb je een boot?', a: [['Ja', 'q', 'enige'], ['Nee', 'q', 'metzonder']] },
  enige:     { t: 'Zou je graag enige eigenaar zijn van de boot?', a: [['Ja', 'q', 'uitlenen'], ['Nee', 'q', 'regelen']] },
  uitlenen:  { t: 'Leen je je boot liever uit aan een vaste groep of onbekende?', a: [['Vast', 'r', 'Ownerkant van sub shared owned'], ['Onbekend', 'r', 'Onwerkant van rented ownership']] },
  regelen:   { t: 'Regel je graag het onderhoud, ligplek en stalling zelf?', a: [['Ja', 'r', 'Shared ownership'], ['Nee', 'r', 'Managed shared ownership']] },
  metzonder: { t: 'Zou je graag met of zonder eigenaarschap varen?', a: [['Met', 'q', 'enige'], ['Zonder', 'q', 'vaardagen']] },
  vaardagen: { t: 'Zou je graag een x aantal vaste vaardagen krijgen?', a: [['Ja', 'r', 'Abonnee kant van sub shared owned'], ['Nee', 'r', 'Huurderskant van rented owned']] }
};

var trail = []; // [{q: id, answer: label}]
var el = function (id) { return document.getElementById(id); };

function show(qid) {
  var q = Q[qid];
  el('step').textContent = 'Vraag ' + (trail.length + 1);
  el('title').textContent = q.t;
  el('result').hidden = true;
  var list = el('answers');
  list.innerHTML = '';
  list.hidden = false;
  q.a.forEach(function (ans) {
    var li = document.createElement('li');
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'knop';
    b.textContent = ans[0];
    b.addEventListener('click', function () {
      trail.push({ q: qid, answer: ans[0] });
      if (ans[1] === 'q') show(ans[2]); else result(ans[2]);
    });
    li.appendChild(b);
    list.appendChild(li);
  });
  el('back').hidden = trail.length === 0;
  el('restart').hidden = true;
  el('title').focus();
}

function result(name) {
  el('step').textContent = 'Uitkomst';
  el('title').textContent = name;
  el('answers').hidden = true;
  var path = el('path');
  path.innerHTML = '';
  trail.forEach(function (h) {
    var li = document.createElement('li');
    li.textContent = Q[h.q].t + ' ';
    var b = document.createElement('b');
    b.textContent = h.answer;
    li.appendChild(b);
    path.appendChild(li);
  });
  el('result').hidden = false;
  el('back').hidden = false;
  el('restart').hidden = false;
  el('title').focus();
}

el('back').addEventListener('click', function () {
  var last = trail.pop();
  if (last) show(last.q);
});
el('restart').addEventListener('click', function () {
  trail = [];
  show('boot');
});

show('boot');
</script>
</body>
</html>
